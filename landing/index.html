<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Escríbenos por WhatsApp</title>
<meta name="description" content="Contáctanos por WhatsApp y te respondemos al instante." />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="data:," />
<style>
  :root {
    --accent: #25d366;
    --accent-dark: #128c4a;
    --ink: #0f172a;
    --muted: #5b6779;
    --bg: #f4f7f5;
    --card: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 70%),
      var(--bg);
    color: var(--ink);
    display: grid;
    place-items: center;
    padding: 24px 18px;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: var(--card);
    border-radius: 22px;
    padding: 34px 26px 28px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 18px 50px rgba(15, 23, 42, .10);
    text-align: center;
  }
  .brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 22px; }
  .brand-mark { width: 30px; height: 30px; display: inline-flex; color: var(--accent); }
  .brand-mark svg { width: 100%; height: 100%; fill: currentColor; }
  .brand-name { font-weight: 700; font-size: 15px; letter-spacing: .01em; color: var(--muted); }
  h1 { font-size: 27px; line-height: 1.22; margin: 0 0 12px; letter-spacing: -.02em; }
  .lede { margin: 0 0 26px; color: var(--muted); font-size: 16px; line-height: 1.55; }
  .cta {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 16px 22px;
    background: var(--accent); color: #fff;
    font-size: 17px; font-weight: 700; text-decoration: none;
    border-radius: 14px;
    transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .cta:hover { background: var(--accent-dark); transform: translateY(-1px); }
  .cta:active { transform: translateY(0); }
  .cta svg { width: 20px; height: 20px; fill: currentColor; flex: none; }
  .bullets {
    list-style: none; padding: 0; margin: 24px 0 0;
    display: grid; gap: 9px; text-align: left;
  }
  .bullets li {
    font-size: 14px; color: var(--muted); display: flex; gap: 9px; align-items: flex-start;
  }
  .bullets li::before {
    content: "✓"; color: var(--accent-dark); font-weight: 800; flex: none;
  }
  .status { min-height: 18px; margin: 14px 0 0; font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.149-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
    </span>
    <span id="business-name" class="brand-name"></span>

  <h1 id="headline"></h1>
  <p id="subheadline" class="lede"></p>

  <a id="cta" class="cta" href="#">

    <span id="cta-label"></span>
  </a>

  <ul id="bullets" class="bullets"></ul>
  <p id="status" class="status" aria-live="polite"></p>
</main>

<script src="./config.js"></script>
<script>
(function () {
  var C = window.LANDING_CONFIG || {};

  document.documentElement.style.setProperty('--accent', C.accent || '#25d366');
  document.documentElement.style.setProperty('--accent-dark', C.accentDark || '#128c4a');
  document.title = C.headline || document.title;

  document.getElementById('business-name').textContent = C.businessName || '';
  document.getElementById('headline').textContent = C.headline || 'Escríbenos por WhatsApp';
  document.getElementById('subheadline').textContent = C.subheadline || '';
  document.getElementById('cta-label').textContent = C.buttonText || 'Abrir WhatsApp';

  var list = document.getElementById('bullets');
  (C.bullets || []).forEach(function (text) {
    var li = document.createElement('li');
    li.textContent = text;
    list.appendChild(li);
  });

  var cta = document.getElementById('cta');
  var status = document.getElementById('status');
  var fallback = 'https://wa.me/' + (C.whatsappNumber || '') + '?text=' + encodeURIComponent(C.whatsappMessage || 'Hola, quiero información.');

  // Enlace de respaldo: si la API del CRM no responde, el botón igual
  // abre WhatsApp. Sin atribución, pero el cliente nunca se queda atascado.
  cta.href = fallback;

  var params = new URLSearchParams(location.search);
  var payload = {
    fbclid: params.get('fbclid') || undefined,
    fbp: (document.cookie.match(/(?:^|; )_fbp=([^;]*)/) || [])[1],
    utmSource: params.get('utm_source') || undefined,
    utmMedium: params.get('utm_medium') || undefined,
    utmCampaign: params.get('utm_campaign') || undefined,
    utmContent: params.get('utm_content') || undefined,
    utmTerm: params.get('utm_term') || undefined
  };

  if (!C.crmApiBase) return;
  status.textContent = 'Preparando tu chat…';

  var done = false;
  var timer = setTimeout(function () {
    if (!done) status.textContent = '';
  }, 6000);

  fetch(C.crmApiBase.replace(/\/+$/, '') + '/api/ad-ref', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
    keepalive: true
  })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (data) {
      done = true;
      clearTimeout(timer);
      status.textContent = '';
      if (data && data.waUrl) cta.href = data.waUrl;
    })
    .catch(function () {
      done = true;
      clearTimeout(timer);
      status.textContent = '';
    });
})();
</script>
</body>
</html>
