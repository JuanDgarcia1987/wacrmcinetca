<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Escríbenos por WhatsApp</title>
<meta name="description" content="Compra en Shein, Temu o AliExpress y paga con Cashea. Te lo llevamos a tu puerta." />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#081630" />
<link rel="icon" href="data:," />
<style>
  :root {
    --accent: #25d366;
    --accent-dark: #128c4a;
    --ink: #ffffff;
    --muted: rgba(255, 255, 255, .78);
    --bg: #081630;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display",
      "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    overflow-x: hidden;
    font-feature-settings: "kern" 1, "liga" 1;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ---------- Fondo ---------- */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    /* La foto se muestra completa, ajustada al ancho. Debajo queda el
       azul de la marca y el degradado hace la transición: así no se
       recorta ni a la persona ni los logos de arriba. */
    background-image: var(--bg-image, none);
    background-size: 100% auto;
    background-position: top center;
    background-repeat: no-repeat;
    background-color: var(--bg);
  }
  /* Degradado: oscurece el arranque para que el nombre se lea, deja
     limpia la zona media y remata en el azul donde va el botón. */
  .bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      180deg,
      rgba(8, 22, 48, .50) 0%,
      rgba(8, 22, 48, .06) 16%,
      rgba(8, 22, 48, 0) 40%,
      rgba(8, 22, 48, .55) 74%,
      rgba(8, 22, 48, .92) 92%,
      rgba(8, 22, 48, 1) 100%
    );
  }

  /* ---------- Contenido ---------- */
  .shell {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    /* La foto ocupa el ancho completo, así que su alto es siempre
       100vw * 1,241. El contenido arranca cuando la foto ya terminó,
       para que el titular nunca se monte sobre el logo de Cashea. */
    padding: max(calc(100vw * 1.241 - 74px), 46vh) 18px calc(18px + var(--safe-b));
  }

  .brand {
    position: absolute;
    top: calc(16px + var(--safe-t));
    left: 18px;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 8px 14px;
    border-radius: 999px;
    background: rgba(8, 22, 48, .55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, .14);
  }
  .brand-mark { width: 20px; height: 20px; display: inline-flex; color: var(--accent); flex: none; }
  .brand-mark svg { width: 100%; height: 100%; fill: currentColor; }
  .brand-name { font-weight: 700; font-size: 14px; letter-spacing: .01em; }

  .bottom {
    margin-top: auto;
    display: grid;
    gap: 12px;
    padding-top: 16px;
    background: linear-gradient(180deg, rgba(8, 22, 48, 0) 0%, var(--bg) 16%, var(--bg) 100%);
  }

  h1 {
    margin: 0;
    font-size: clamp(24px, 7vw, 33px);
    line-height: 1.22;
    letter-spacing: -.033em;
    font-weight: 800;
    text-wrap: balance;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 6px 26px rgba(0, 0, 0, .40);
  }
  /* Palabra clave resaltada: rompe el bloque plano de texto y guía la
     lectura al beneficio, que es Cashea. */
  h1 em {
    font-style: normal;
    color: #ffd766;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .50), 0 6px 26px rgba(0, 0, 0, .40);
  }
  .lede {
    margin: 0;
    color: rgba(255, 255, 255, .82);
    font-size: clamp(13.5px, 3.7vw, 15.5px);
    line-height: 1.52;
    letter-spacing: .002em;
    font-weight: 400;
    text-shadow: 0 1px 10px rgba(0, 0, 0, .40);
  }

  .cta {
    display: inline-flex; align-items: center; justify-content: center; gap: 11px;
    width: 100%; padding: 17px 22px;
    background: var(--accent); color: #ffffff;
    font-size: 18px; font-weight: 800; text-decoration: none;
    text-shadow: 0 1px 3px rgba(0, 0, 0, .22);
    border-radius: 16px;
    transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    box-shadow: 0 10px 26px rgba(37, 211, 102, .34), 0 2px 0 rgba(0, 0, 0, .12) inset;
    margin-top: 2px;
  }
  .cta:hover { background: #1fbe5b; }
  .cta:active { transform: scale(.985); }
  .cta svg { width: 22px; height: 22px; fill: #ffffff; flex: none; }

  .bullets {
    list-style: none; padding: 0; margin: 0;
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .bullets li {
    font-size: 12px; font-weight: 600;
    letter-spacing: .01em;
    color: rgba(255, 255, 255, .95);
    padding: 6px 12px 6px 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .11);
    border: 1px solid rgba(255, 255, 255, .16);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .bullets li::before {
    content: "";
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 2px rgba(37, 211, 102, .22);
    flex: none;
  }
  .status { min-height: 15px; margin: 0; font-size: 12px; color: rgba(255, 255, 255, .60); text-align: center; }

  /* En pantallas altas y de escritorio, el contenido no se estira
     hasta el borde: se limita el ancho y se centra. */
  @media (min-width: 620px) {
    .shell { max-width: 460px; margin: 0 auto; padding-left: 0; padding-right: 0; }
  }
  @media (max-height: 640px) {
    h1 { font-size: 24px; }
    .cta { padding: 15px 20px; font-size: 17px; }
  }
</style>
</head>
<body>

<div class="bg" id="bg" aria-hidden="true"></div>

<main class="shell">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.149-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
    </span>
    <span id="business-name" class="brand-name"></span>
  </div>

  <div class="bottom">
    <h1 id="headline"></h1>
    <p id="subheadline" class="lede"></p>

    <a id="cta" class="cta" href="#">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.149-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      <span id="cta-label"></span>
    </a>

    <ul id="bullets" class="bullets"></ul>
    <p id="status" class="status" aria-live="polite"></p>
  </div>
</main>

<script src="./config.js"></script>
<script>
(function () {
  var C = window.LANDING_CONFIG || {};

  document.documentElement.style.setProperty('--accent', C.accent || '#25d366');
  document.documentElement.style.setProperty('--accent-dark', C.accentDark || '#128c4a');
  document.title = C.headline || document.title;

  if (C.backgroundImage) {
    document.documentElement.style.setProperty('--bg-image', 'url("' + C.backgroundImage + '")');
  }

  document.getElementById('business-name').textContent = C.businessName || '';
  document.getElementById('headline').innerHTML = C.headline || 'Escríbenos por WhatsApp';
  document.getElementById('subheadline').textContent = C.subheadline || '';
  document.getElementById('cta-label').textContent = C.buttonText || 'Abrir WhatsApp';

  var list = document.getElementById('bullets');
  (C.bullets || []).forEach(function (text) {
    var li = document.createElement('li');
    li.textContent = text;
    list.appendChild(li);
  });

  var cta = document.getElementById('cta');
  var status = document.getElementById('status');
  var fallback = 'https://wa.me/' + (C.whatsappNumber || '') + '?text=' + encodeURIComponent(C.whatsappMessage || 'Hola, quiero información.');

  // Enlace de respaldo: si la API del CRM no responde, el botón igual
  // abre WhatsApp. Sin atribución, pero el cliente nunca se queda atascado.
  cta.href = fallback;

  var params = new URLSearchParams(location.search);
  var payload = {
    fbclid: params.get('fbclid') || undefined,
    fbp: (document.cookie.match(/(?:^|; )_fbp=([^;]*)/) || [])[1],
    utmSource: params.get('utm_source') || undefined,
    utmMedium: params.get('utm_medium') || undefined,
    utmCampaign: params.get('utm_campaign') || undefined,
    utmContent: params.get('utm_content') || undefined,
    utmTerm: params.get('utm_term') || undefined,
    landingUrl: location.href
  };

  if (!C.crmApiBase) return;
  status.textContent = 'Preparando tu chat…';

  var done = false;
  var timer = setTimeout(function () {
    if (!done) status.textContent = '';
  }, 6000);

  fetch(C.crmApiBase.replace(/\/+$/, '') + '/api/ad-ref', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
    keepalive: true
  })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (data) {
      done = true;
      clearTimeout(timer);
      status.textContent = '';
      if (data && data.waUrl) cta.href = data.waUrl;
    })
    .catch(function () {
      done = true;
      clearTimeout(timer);
      status.textContent = '';
    });
})();
</script>
</body>
</html>
